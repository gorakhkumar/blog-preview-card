<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

main {
  background: hsl(47, 88%, 63%);
  font-family: 'Figtree', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: hsl(0, 0%, 100%);
  width: 340px;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid hsl(0, 0%, 7%);
  box-shadow: 8px 8px 0 hsl(0, 0%, 7%);
}

.card > img:first-child {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 16px;
}

.tag {
  background: hsl(47, 88%, 63%);
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 6px;
  display: inline-block;
  margin-bottom: 12px;
}

.date {
  font-size: 14px;
  margin-bottom: 12px;
}

h1 {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 12px;
  cursor: pointer;
}

h1:hover {
  color: hsl(47, 88%, 63%);
}

.description {
  font-size: 16px;
  color: hsl(0, 0%, 42%);
  margin-bottom: 18px;
}

.author {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
}

.author img {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}

    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

 <main class="wrapper">

    <article class="card">

      <img src="./assets/images/illustration-article.svg" alt="Blog illustration">

      <span class="tag">Learning</span>

      <p class="date">Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>

      <div class="author">
        <img src="./assets/images/image-avatar.webp" alt="Author avatar">
        <span>Greg Hooper</span>
      </div>

    </article>

  </main>

  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://gorakhkumar.github.io/gorakh-portfolio/">Gorakh Kumar</a>.
  </div>
</body>
</html>
